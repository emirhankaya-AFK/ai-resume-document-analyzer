[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-resume-document-analyzer"
version = "0.1.0"
description = "Production-shaped ai-resume-document-analyzer API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn[standard]>=0.34,<1"]
[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
